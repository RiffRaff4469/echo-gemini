[pytest]
testpaths = server
# server/tools/test_display.py is a live-fire script against a running server,
# not a unit test -- its pytest twin is server/tests/test_display_api.py.
norecursedirs = tools .venv .git assets
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q
filterwarnings =
    ignore::DeprecationWarning:google.*
